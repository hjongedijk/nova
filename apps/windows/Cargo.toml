# NOVA for Windows: one native agent, helper and living wallpaper (Tauri v2 + WebView2).
# nova-win-core has no GUI dependency and is tested on any OS; src-tauri is the thin Windows glue.
[workspace]
resolver = "2"
members = ["crates/nova-win-core", "crates/nova-win-agent", "src-tauri"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[package]
name = "nova-win-agent"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
nova-win-core = { path = "../nova-win-core" }
tiny_http = "0.12"
sysinfo = "0.36"
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse"] }
winreg = "0.55"

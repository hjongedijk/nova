[package]
name = "nova-win-agent"
version = "0.1.1"
edition = "2021"
publish = false

[dependencies]
nova-win-core = { path = "../nova-win-core" }
tiny_http = "0.12"
sysinfo = "0.36"
serde_json = "1"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
url = "2"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
tungstenite = { version = "0.28", default-features = false, features = ["handshake"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Shutdown", "Win32_System_Threading", "Win32_UI_Input_KeyboardAndMouse", "Win32_Graphics_Gdi", "Win32_UI_HiDpi", "Win32_System_JobObjects", "Win32_Security", "Win32_System_Diagnostics_ToolHelp"] }
winreg = "0.55"

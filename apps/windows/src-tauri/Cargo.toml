[package]
name = "nova"
version = "0.1.0"
edition = "2021"
description = "NOVA for Windows: one native agent, helper and wallpaper."
license = "MIT"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
nova-win-agent = { path = "../crates/nova-win-agent" }
nova-win-core = { path = "../crates/nova-win-core" }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
tiny_http = "0.12"
sysinfo = "0.36"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }

[target.'cfg(windows)'.dependencies]
webview2-com = "0.39.1"
# Tauri/WebView2 use 0.62 handles; existing Win32 helpers keep their 0.61 API.
windows-webview = { package = "windows", version = "0.62", features = ["Win32_Foundation"] }
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Shell",
  "Win32_System_Shutdown",
  "Win32_System_Threading",
  "Win32_Storage_FileSystem",
] }
winreg = "0.55"

[features]
default = ["custom-protocol"]
# Embeds the (tiny) local setup page; without it a release build would look for a dev server.
custom-protocol = ["tauri/custom-protocol"]

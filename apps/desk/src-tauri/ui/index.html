<!doctype html>
<html lang="nl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NOVA Desk</title>
    <link rel="stylesheet" href="setup.css" />
  </head>
  <body>
    <main>
      <h1>NOVA Desk</h1>
      <p>
        Vul het adres in waar NOVA draait. Je ziet het ook in je browser,
        bijvoorbeeld <code>http://192.168.1.10:8080</code> of
        <code>https://nova.example.nl</code>.
      </p>
      <form id="form">
        <label for="url">Adres van NOVA</label>
        <input
          id="url"
          name="url"
          type="text"
          autocomplete="off"
          spellcheck="false"
          placeholder="https://nova.example.nl"
        />
        <button type="submit">Opslaan en starten</button>
      </form>
      <p id="message" role="status"></p>
      <p class="note">
        Je kunt NOVA Desk ook starten met <code>--url</code>, of het adres
        zetten in <code>%LOCALAPPDATA%\NOVA\desk.json</code>.
      </p>
    </main>
    <script src="setup.js"></script>
  </body>
</html>

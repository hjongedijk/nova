# UNTESTED DRAFT. Merge into deploy/docker-compose.yml (not done by the spike). Enable with COMPOSE_PROFILES=...,linphone-chat
services:
  linphone-chat:
    profiles: ["linphone-chat"]
    build: ./linphone-chat
    image: nova-linphone-chat:local
    restart: unless-stopped
    environment:
      LINPHONE_IDENTITY: "sip:nova-chat@sip.linphone.org" # the SECOND account, not nova-techlepp
      LINPHONE_PASSWORD_FILE: /run/secrets/linphone_chat_password
      LINPHONE_SERVER: "sip:sip.linphone.org;transport=tls"
      LINPHONE_LIME_URL: "https://lime.linphone.org/lime-server/lime-server.php"
      NOVA_URL: "http://nova:3000/api/integrations/linphone-chat"
      NOVA_CHAT_TOKEN_FILE: /run/secrets/nova_message_token # same value as messageToken in telephony.json
    secrets: [linphone_chat_password, nova_message_token]
    volumes:
      - ./nova-data/linphone-chat:/data # LIME keys + linphone DB; chmod 700, uid 10001
    networks: [nova]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
secrets:
  linphone_chat_password:
    file: ./secrets/linphone_chat_password # mode 0600, never in git
  nova_message_token:
    file: ./secrets/nova_message_token

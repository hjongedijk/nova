<script type="text/javascript">
  RED.nodes.registerType("nova-ask", {
    category: "NOVA",
    color: "#7656a8",
    defaults: { name: { value: "" } },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-comment",
    label: function () {
      return this.name || "NOVA vraag";
    },
    paletteLabel: "NOVA vraag",
  });
</script>

<script type="text/html" data-template-name="nova-ask">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Naam</label>
    <input type="text" id="node-input-name" placeholder="NOVA vraag" />
  </div>
</script>

<script type="text/html" data-help-name="nova-ask">
  <p>
    Stelt <code>msg.payload</code> als vraag aan NOVA via haar gewone chatroute.
  </p>
  <p>
    Het antwoord komt in <code>msg.payload</code>; het volledige antwoord staat
    in <code>msg.nova</code>.
  </p>
  <p>
    Toolacties blijven achter NOVA's bestaande bevestigingspoort. Dit node kan
    die niet goedkeuren.
  </p>
</script>

<script type="text/javascript">
  RED.nodes.registerType("nova-ask", {
    category: "NOVA",
    color: "#7656a8",
    defaults: {
      name: { value: "" },
      proactive: { value: false },
    },
    inputs: 1,
    outputs: 1,
    icon: "font-awesome/fa-comment",
    label: function () {
      return this.name || "NOVA vraag";
    },
    paletteLabel: "NOVA vraag",
  });
</script>

<script type="text/html" data-template-name="nova-ask">
  <div class="form-row">
    <label for="node-input-name"><i class="fa fa-tag"></i> Naam</label>
    <input type="text" id="node-input-name" placeholder="NOVA vraag" />
  </div>
  <div class="form-row">
    <label for="node-input-proactive">
      <i class="fa fa-shield"></i> Proactieve flow
    </label>
    <input
      type="checkbox"
      id="node-input-proactive"
      style="display: inline-block; width: auto; vertical-align: top;"
    />
    <span>Beperk deze node tot alleen-lezen gereedschappen</span>
  </div>
</script>

<script type="text/html" data-help-name="nova-ask">
  <p>
    Stelt <code>msg.payload</code> als vraag aan NOVA. Voor geplande of
    proactieve routines schakelt u de alleen-lezen beveiliging in.
  </p>
  <p>
    Het antwoord komt in <code>msg.payload</code>; het volledige antwoord staat
    in <code>msg.nova</code>.
  </p>
  <p>
    In proactieve modus gebruikt dit node een aparte token-beveiligde route die
    uitsluitend tools met risico <code>READ_ONLY</code> kan uitvoeren. De modus
    kan geen acties goedkeuren.
  </p>
</script>

# NOVA production stack. Put this file in e.g. /opt/nova, with .env and the *-data folders next to it.
# Update: set NOVA_VERSION in .env, then: docker compose pull && docker compose up -d
# Once: mkdir -p nova-data/workspace nova-data/mcp-relay/context7
# Then: chown -R 1000:1000 nova-data nova-backups nodered-data
name: nova

x-restart: &restart
  restart: unless-stopped

services:
  nova:
    <<: *restart
    image: ghcr.io/${NOVA_OWNER:-hjongedijk}/nova:${NOVA_VERSION:-latest}
    container_name: nova
    env_file: .env
    environment:
      # Internal wiring: fixed, not from .env.
      PORT: 8080
      HTTPS_PORT: 8443
      NOVA_DATA_DIR: /data
      NOVA_BACKUP_DIR: /backups
      NOVA_PIPER_TTS_URL: ${NOVA_PIPER_TTS_URL:-}
      # This service has restart: unless-stopped, so NOVA may safely request a graceful restart.
      NOVA_RESTART_ENABLED: "true"
      NOVA_STACK_CONTROL_URL: http://stack-control:8090
      # Asterisk (profile telephony) shares the private network; NOVA only talks to it when Telefonie is on.
      NOVA_ASTERISK_ARI_URL: http://asterisk:8088
      NOVA_STACK_CONTROL_TOKEN: ${NOVA_STACK_CONTROL_TOKEN:-}
      OMNIROUTE_URL: http://omniroute:20128/v1
      OMNIROUTE_DATABASE: /omniroute/storage.sqlite
      MQTT_URL: mqtt://mqtt:1883
      QDRANT_URL: http://qdrant:6333
      NODE_RED_URL: http://node-red:1880
      NODE_RED_EVENT_TOKEN: ${NODE_RED_EVENT_TOKEN:-}
      NODE_RED_FLOW_ALLOWLIST: ${NODE_RED_FLOW_ALLOWLIST:-[]}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      NODE_RED_FLOW_TOKEN: ${NODE_RED_FLOW_TOKEN:-}
      NODE_RED_ADMIN_TOKEN: ${NODE_RED_ADMIN_TOKEN:-}
      NODE_RED_EDITOR_URL: ${NODE_RED_EDITOR_URL:-}
      HOME_ASSISTANT_URL: ${HOME_ASSISTANT_URL:-http://host.docker.internal:8123}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
    ports:
      - "8080:8080" # http (behind a reverse proxy: only this one)
      - "8443:8443" # https with nova-data/certs (microphone and app install on the LAN)
    volumes:
      - ./nova-data:/data
      - ./nova-backups:/backups
      - ./omniroute-data:/omniroute:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      node-red:
        condition: service_healthy
      omniroute:
        condition: service_started
      mqtt:
        condition: service_started
      qdrant:
        condition: service_started
    networks: [nova, stack-control]

  # Optional local voice runtime. No host port: only NOVA can reach it on the stack network.
  piper:
    <<: *restart
    profiles: [personal-voice]
    build: ./piper
    container_name: nova-piper
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    environment:
      HOME: /tmp
    volumes:
      - ./nova-data/piper-voices:/voices:ro
    command:
      [
        "python3",
        "-m",
        "piper.http_server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--data-dir",
        "/voices",
        "-m",
        "en_GB-jarvis-medium",
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/voices', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [nova]

  # Optional telephony: Asterisk PBX that NOVA controls over ARI (Settings > Telefonie). Enable with
  # COMPOSE_PROFILES=...,telephony after switching Telefonie on once (that generates the configuration). No host
  # ports: it registers outward to a SIP trunk (for example sip.linphone.org) and only NOVA reaches ARI and
  # AudioSocket on the private network. Publish SIP/RTP yourself only for phones on your own LAN. See docs/telephony.md.
  asterisk:
    <<: *restart
    profiles: [telephony]
    build: ./asterisk
    image: nova-asterisk:local
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    environment:
      ASTERISK_TERMINAL_OPTS: "-n"
    volumes:
      - ./nova-data/asterisk/conf:/nova-conf:ro
      - ./nova-data/asterisk/recordings:/var/spool/asterisk/recording
    networks: [nova]
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # Encrypted (LIME) Linphone chat with NOVA, profile linphone-chat. Logs in with the SAME Linphone account as Asterisk (the
  # trunk), as a second device: it never touches calls and ignores cleartext texts (Asterisk handles those). BUILT LOCALLY
  # (docker compose build linphone-chat), never pushed to a registry: the Belledonne wheel inside is GPLv3.
  # Needs two secret files you create once (see docs/linphone-encrypted-chat.md): secrets/linphone_password and
  # secrets/nova_message_token, mode 0400, owner uid 10001. Data (LIME keys, chat DB, device id): nova-data/linphone-chat,
  # owner uid 10001, mode 0700. Anyone who can read that folder can read the chats.
  linphone-chat:
    <<: *restart
    profiles: [linphone-chat]
    build: ./linphone-chat
    image: nova-linphone-chat:local
    user: "10001:10001"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 128
    mem_limit: 768m
    cpus: 1
    stop_grace_period: 15s
    environment:
      # SIP username and domain come from NOVA's trunk (token-protected endpoint); only the password is a secret file.
      NOVA_URL: http://nova:8080/api/integrations/linphone-chat
      NOVA_CHAT_TOKEN_FILE: /run/secrets/nova_message_token
      LINPHONE_PASSWORD_FILE: /run/secrets/linphone_password
      LINPHONE_LIME_URL: ${LINPHONE_LIME_URL:-https://lime.linphone.org/lime-server/lime-server.php}
      LINPHONE_CONFERENCE_FACTORY: ${LINPHONE_CONFERENCE_FACTORY:-sip:conference-factory@sip.linphone.org}
    secrets: [linphone_password, nova_message_token]
    volumes:
      - ./nova-data/linphone-chat:/data
    networks: [nova]
    depends_on:
      nova:
        condition: service_started
    healthcheck:
      test:
        - CMD
        - /opt/venv/bin/python
        - -I
        - -c
        - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8099/health', timeout=4)
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  # The only component with Docker socket access. It exposes fixed, token-protected
  # status/restart and project-sandbox routes on a private network shared only with NOVA.
  stack-control:
    <<: *restart
    image: ghcr.io/${NOVA_OWNER:-hjongedijk}/nova:${NOVA_VERSION:-latest}
    container_name: nova-stack-control
    user: "0:0" # Docker socket access; the broker exposes only fixed operations.
    command: ["node", "/app/stack-control/server.mjs"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    environment:
      PORT: 8090
      STACK_CONTROL_TOKEN: ${NOVA_STACK_CONTROL_TOKEN:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./nova-data/workspace:/workspace-host:ro
      - ./nova-data/mcp-relay:/relay-host:ro
    networks: [stack-control]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8090/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3

  # Only this trusted, fixed-route relay can reach Context7; MCP workers have no IP network.
  mcp-egress:
    <<: *restart
    image: ghcr.io/${NOVA_OWNER:-hjongedijk}/nova:${NOVA_VERSION:-latest}
    container_name: nova-mcp-egress
    user: "1000:1000" # Relay directory uses the same ownership as nova-data.
    command: ["node", "/app/stack-control/mcp-egress-server.mjs"]
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 32
    mem_limit: 64m
    cpus: 0.25
    volumes:
      - ./nova-data/mcp-relay:/relay-host
    networks: [nova]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "require('node:http').get({socketPath:'/relay-host/context7/relay.sock',path:'/health'},r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 3s
      retries: 3

  node-red:
    <<: *restart
    image: nodered/node-red:4.1
    container_name: nova-node-red
    user: "1000:1000" # official Node-RED image user
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
      NODE_RED_EVENT_TOKEN: ${NODE_RED_EVENT_TOKEN:-}
      NODE_RED_FLOW_TOKEN: ${NODE_RED_FLOW_TOKEN:-}
      NOVA_APP_TOKEN: ${NOVA_APP_TOKEN:-}
    volumes:
      - ./nodered-data:/data
      - ./nodered:/opt/nova/nodered-seed:ro
    entrypoint: ["/bin/sh", "/opt/nova/nodered-seed/seed-entrypoint.sh"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1880/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks: [nova]

  omniroute:
    <<: *restart
    image: ghcr.io/${NOVA_OWNER:-hjongedijk}/nova:omniroute-${NOVA_VERSION:-latest}
    container_name: nova-omniroute
    user: "0:0" # its data folder belongs to root
    stop_grace_period: 40s
    environment:
      DATA_DIR: /app/data
      NODE_ENV: production
      PORT: 20128
      OMNIROUTE_AUTO_FREE_FALLBACK_TO_FULL_POOL: "false"
    ports: ["20128:20128"]
    volumes: ["./omniroute-data:/app/data"]
    networks: [nova]

  mqtt:
    <<: *restart
    image: eclipse-mosquitto:2
    container_name: nova-mqtt
    user: "0:0" # its data folder belongs to root
    ports: ["1883:1883"]
    volumes:
      - ./mosquitto-data/config:/mosquitto/config
      - ./mosquitto-data/data:/mosquitto/data
      - ./mosquitto-data/log:/mosquitto/log
    networks: [nova]

  qdrant:
    <<: *restart
    image: qdrant/qdrant:v1.17.0
    container_name: nova-qdrant
    user: "0:0" # its data folder belongs to root
    volumes: ["./qdrant-data:/qdrant/storage"]
    networks: [nova]

  home-assistant:
    <<: *restart
    image: ghcr.io/home-assistant/home-assistant:2026.9.4
    container_name: nova-home-assistant
    user: "0:0" # its data folder belongs to root
    network_mode: host
    environment:
      TZ: ${TZ:-Europe/Amsterdam}
    volumes: ["./home-assistant-data:/config"]

# Only used by the linphone-chat profile; the files must exist before that profile starts (docs/linphone-encrypted-chat.md).
secrets:
  linphone_password:
    file: ./secrets/linphone_password
  nova_message_token:
    file: ./secrets/nova_message_token

networks:
  nova:
    name: nova
  stack-control:
    name: nova-stack-control
    internal: true

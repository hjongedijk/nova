# Development: only what NOVA talks to. NOVA itself runs with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
name: nova-dev

services:
  omniroute:
    image: diegosouzapw/omniroute@sha256:8bd462c9f60d8eda79329cfbb6ea7ea723505fe7721beb944f3d43835409e218
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      OMNIROUTE_AUTO_FREE_FALLBACK_TO_FULL_POOL: "false"
    ports: ["20128:20128"]
    volumes: ["./dev-data/omniroute:/app/data"]

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ["1883:1883"]

  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: ["./dev-data/qdrant:/qdrant/storage"]

  # Optional: only for your own flows.
  node-red:
    image: nodered/node-red:4.1
    restart: unless-stopped
    profiles: ["node-red"]
    ports: ["1880:1880"]
    volumes: ["./dev-data/node-red:/data"]

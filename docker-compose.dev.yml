# Development: only what NOVA talks to. NOVA itself runs with `npm run dev`.
#   docker compose -f docker-compose.dev.yml up -d
name: nova-dev

services:
  piper:
    profiles: [personal-voice]
    build: ./deploy/piper
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    pids_limit: 64
    mem_limit: 2g
    cpus: 2
    environment:
      HOME: /tmp
    volumes:
      - ./dev-data/piper:/voices:ro
    command:
      [
        "python3",
        "-m",
        "piper.http_server",
        "--host",
        "0.0.0.0",
        "--port",
        "5000",
        "--data-dir",
        "/voices",
        "-m",
        "en_GB-jarvis-medium",
      ]
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test:
        [
          "CMD",
          "python3",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/voices', timeout=3)",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  omniroute:
    image: diegosouzapw/omniroute@sha256:8bd462c9f60d8eda79329cfbb6ea7ea723505fe7721beb944f3d43835409e218
    restart: unless-stopped
    environment:
      DATA_DIR: /app/data
      PORT: 20128
      OMNIROUTE_AUTO_FREE_FALLBACK_TO_FULL_POOL: "false"
    ports: ["20128:20128"]
    volumes: ["./dev-data/omniroute:/app/data"]

  mqtt:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    command: mosquitto -c /mosquitto-no-auth.conf
    ports: ["1883:1883"]

  qdrant:
    image: qdrant/qdrant:v1.17.0
    restart: unless-stopped
    ports: ["6333:6333"]
    volumes: ["./dev-data/qdrant:/qdrant/storage"]

  node-red:
    image: nodered/node-red:4.1
    restart: unless-stopped
    environment:
      NODE_RED_EVENT_TOKEN: ${NODE_RED_EVENT_TOKEN:-}
      OPENROUTESERVICE_API_KEY: ${OPENROUTESERVICE_API_KEY:-}
      NODE_RED_FLOW_TOKEN: ${NODE_RED_FLOW_TOKEN:-}
    ports: ["127.0.0.1:1880:1880"]
    volumes:
      - ./dev-data/node-red:/data
      - ./deploy/nodered:/opt/nova/nodered-seed:ro
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/opt/nova/nodered-seed/seed-entrypoint.sh"]
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:1880/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s

  # Telephony: Asterisk PBX that NOVA controls over ARI. Off unless started explicitly:
  #   docker compose -f docker-compose.dev.yml --profile telephony up -d asterisk
  # First switch Telefonie on in the NOVA settings: that generates ./dev-data/asterisk/conf with random
  # passwords. SIP/ARI/RTP are bound to loopback by default; set NOVA_SIP_BIND to a LAN IP (never a
  # public one) to let phones on the network register. See docs/integrations.md#telephony-and-conversations.
  asterisk:
    profiles: [telephony]
    build: ./deploy/asterisk
    restart: unless-stopped
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    security_opt: [no-new-privileges:true]
    pids_limit: 256
    mem_limit: 512m
    cpus: 1
    environment:
      ASTERISK_TERMINAL_OPTS: "-n"
    volumes:
      - ./dev-data/asterisk/conf:/nova-conf:ro
      - ./dev-data/asterisk/recordings:/var/spool/asterisk/recording
    ports:
      - "${NOVA_SIP_BIND:-127.0.0.1}:5060:5060/udp"
      - "${NOVA_SIP_BIND:-127.0.0.1}:5060:5060/tcp"
      - "127.0.0.1:8088:8088/tcp"
      - "${NOVA_SIP_BIND:-127.0.0.1}:${NOVA_RTP_START:-10000}-${NOVA_RTP_END:-10100}:${NOVA_RTP_START:-10000}-${NOVA_RTP_END:-10100}/udp"
    healthcheck:
      test: ["CMD", "asterisk", "-rx", "core show uptime"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

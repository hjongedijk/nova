name: Release

# git tag v0.1.6 && git push origin v0.1.6
on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nova
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: NOVA_VERSION=${{ github.ref_name }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  omniroute-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
        with:
          image: mirror.gcr.io/tonistiigi/binfmt:latest
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/nova
          tags: |
            type=semver,pattern={{version}},prefix=omniroute-
            type=semver,pattern={{major}}.{{minor}},prefix=omniroute-
            type=raw,value=omniroute-latest
      - uses: docker/build-push-action@v7
        with:
          context: deploy/omniroute
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=omniroute
          cache-to: type=gha,mode=max,scope=omniroute

  # Windows artifacts are independent: a failed Windows build does not block the server release.
  windows:
    runs-on: windows-latest
    continue-on-error: true
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/windows
      - name: Test native agent
        working-directory: apps/windows
        run: cargo test --locked -p nova-win-core -p nova-win-agent
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - name: Build portable app and installer
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        shell: pwsh
        run: ./.github/scripts/build-windows.ps1 -Version "${{ github.ref_name }}"
      - uses: softprops/action-gh-release@v3
        with:
          files: |
            windows-out/NOVA-Setup-*.exe
            windows-out/NOVA-Setup-*.exe.sig
            windows-out/latest.json
            windows-out/nova-windows.zip
          fail_on_unmatched_files: true

  agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Package Compose runtime sources
        run: |
          tar --exclude='*/test' --exclude='*/node_modules' -czf nova-compose.tar.gz -C deploy docker-compose.yml nodered piper asterisk linphone-chat
      - uses: softprops/action-gh-release@v3
        with:
          body_path: docs/release-notes/${{ github.ref_name }}.md
          files: |
            deploy/docker-compose.yml
            nova-compose.tar.gz

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:model-evaluation
      - run: npm test -w @nova/web
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: npm run check:privacy-screenshots
      - run: node scripts/check-nodered-flows.mjs
      - run: npm test --prefix deploy/nodered/node-red-contrib-nova
      - run: npm run test:nodered-seed
      - run: node scripts/test-nodered-flows.mjs
      - run: node scripts/test-briefing-runtime.mjs
      - run: npm run test:compose-notification
      - run: node --test deploy/omniroute/repair-stream-content.test.mjs
      - run: npm run test:mcp-sandbox
      # The Windows agent cannot run here, but its syntax and embedded C# can be checked.
      - run: pwsh -NoProfile -File agents/windows/test/check.ps1
      - run: pwsh -NoProfile -File agents/windows/test/desktop.ps1

  # NOVA Desk (apps/desk): the pure core is tested here; the Windows app is only compiled (for the Windows target),
  # the real build and run happen on a Windows runner in the release workflow.
  desk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desk
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - name: Test the pure core
        working-directory: apps/desk
        run: cargo test -p nova-desk-core
      - name: Compile the Windows app
        working-directory: apps/desk
        run: cargo check --target x86_64-pc-windows-gnu -p nova-desk

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  omniroute-image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v7
        with:
          context: deploy/omniroute
          platforms: linux/amd64,linux/arm64
          push: false
          cache-from: type=gha,scope=omniroute
          cache-to: type=gha,mode=max,scope=omniroute

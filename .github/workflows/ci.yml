name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm test -w @nova/web
      - run: npm run build
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr
      - run: npm run check:privacy-screenshots
      - run: node scripts/check-nodered-flows.mjs
      - run: npm test --prefix deploy/nodered/node-red-contrib-nova
      - run: npm run test:nodered-seed
      - run: node scripts/test-nodered-flows.mjs
      - run: node scripts/test-briefing-runtime.mjs
      - run: npm run test:compose-notification
      - run: npm run test:mcp-sandbox
      # The Windows agent cannot run here, but its syntax and embedded C# can be checked.
      - run: pwsh -NoProfile -File agents/windows/test/check.ps1

  image:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-buildx-action@v4
        with:
          driver-opts: image=mirror.gcr.io/moby/buildkit:buildx-stable-1
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
